[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coopx"
version = "0.1.0"
description = "Object-level cooperative perception testbed"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "cryptography",
    "pillow",
    "opencv-python-headless<4.12",
    "pyyaml",
]

[project.optional-dependencies]
geometry = ["numpy>=1.26,<2"]

[project.scripts]
coopx = "coopx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
